{{ define "main" }}
  {{ .Content }}

  {{ with .Site.GetPage "section" "posts" }}
    <p><strong>Recent Posts</strong></p>
    {{ if .RegularPages }}  {{/* 只要存在普通文章就显示 */}}
      {{ range first 5 (.RegularPages.ByDate.Reverse) }}  {{/* 取最近5篇（按日期降序） */}}
        <div class="content">
          <div class="flex-grow">
            <div class="grid grid-cols-3 gap-4 my-2">
              <a href="{{ .RelPermalink }}" class="col-span-2">{{ .Title }}</a>
              <div class="flex justify-end">
                {{- partial "date" .Date -}}
              </div>
            </div>
          </div>
        </div>
      {{ end }}
    {{ end }}
  {{ end }}
{{ end }}

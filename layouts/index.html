{{ define "main" }}
  {{ .Content }}
  
  {{ with .Site.GetPage "section" "posts" }}
    {{ if gt (len .RegularPages) 5 }}
      <p><strong>Recent Posts</strong></p>
      {{ range first 5 (.Pages.ByDate.Reverse) }}
        <div class="content">
          <div class="flex-grow">
              <div class="grid grid-cols-3 gap-4 my-2">
                <a href="{{ .RelPermalink }}" class="col-span-2">{{ .Title }}</a>
                <div class="flex justify-end">
                  {{- partial "date" .Date -}}
                </div>
              </div>
          </div>
        </div>
      {{ end }}
    {{ end }}
  {{ end }}
{{ end }}
